<div id="paper-app"><div class="state">Loading papers…</div></div>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
#paper-app{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Gujarati",Arial,sans-serif;color:#20252d;}
#paper-app *{box-sizing:border-box;}
#paper-app .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:16px 0;}
#paper-app .card{background:#fff;border:1px solid #d9e1e7;border-radius:8px;padding:16px;text-align:left;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:6px;position:relative;font-family:inherit;}
#paper-app .card:hover{border-color:#145c8b;box-shadow:0 2px 8px rgba(20,92,139,.12);transform:translateY(-1px);}
#paper-app .card b{font-size:15px;color:#20252d;}
#paper-app .card small{color:#65717d;font-size:13px;}
#paper-app .tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;align-self:flex-start;background:#e8f5e9;color:#2e7d32;}
#paper-app .tag.locked{background:#fff3e0;color:#e65100;}
#paper-app .state{padding:16px;border:1px solid #d9e1e7;border-radius:8px;background:#f7f9fb;color:#20252d;margin:12px 0;}
#paper-app .muted{color:#65717d;font-size:14px;}
#paper-app h2{color:#145c8b;margin:16px 0 8px;}
#paper-app button{font-family:inherit;}
</style>
